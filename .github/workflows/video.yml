# Makes a video entirely in the cloud with free providers (code/free/run.py). Nothing runs on the laptop.
#   gh workflow run video.yml -f project=<name> [-f args="--heroes 15 --voice edge"]
# Every 6 hours it also resumes unfinished videos and adds motion clips when the free ZeroGPU quota is back.
# Repo secrets: HF_TOKEN, KAGGLE_API_TOKEN (optional: GEMINI_API_KEY, CF_ACCOUNT_ID, CF_API_TOKEN). Repo variable: HF_REPO.
name: video
on:
  workflow_dispatch:
    inputs:
      project: {description: "project (HF work/<project>/scenes.json)", required: true}
      args: {description: "extra arguments for run.py", required: false, default: ""}
  schedule:
    - cron: "23 */6 * * *"
concurrency:
  group: video-${{ inputs.project || 'resume-all' }}
  cancel-in-progress: false
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      HF_REPO: ${{ vars.HF_REPO }}
      WHISPER_DIR: /home/runner/.cache/whisper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: code/free/requirements.txt}
      - uses: actions/cache@v4
        with: {path: /home/runner/.cache/whisper, key: whisper-small-en}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -q -r code/free/requirements.txt
      - name: make video
        if: github.event_name == 'workflow_dispatch'
        run: python code/free/run.py "${{ inputs.project }}" ${{ inputs.args }}
      - name: resume unfinished videos
        if: github.event_name == 'schedule'
        run: python code/free/run.py --resume-all
